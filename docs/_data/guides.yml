# Single source for the guides hub (resources/index.html, all three languages, via
# _includes/guide-hub.html) and the "Keep reading" block at the end of every guide
# (_includes/guide-next.html). Adding a guide = one entry under `guides`; it appears on
# the EN, PT and ES hubs, in the hub search and in "Keep reading" automatically.
#
# groups: topic sections, in hub order. `near` lists the neighbouring groups to borrow
#         from, nearest first, when a guide's own group has fewer than three other entries.
#         `name` is the lower-case form used in running text ("All guides on …"),
#         `title` the section heading, `intro` the paragraph beside the cards.
# types:  what a resource is, for the hub's type filter. A type only shows as a filter
#         once at least one guide uses it.
# guides: in hub order; `path` is the EN path (PT/ES get the /pt or /es prefix).
#         `kind` is the small label on the card; `summary` is the short text for "Keep
#         reading", `blurb` the slightly longer one on the hub; `cta` the card's link line.
#         `keywords` are extra search terms (standards, record names, synonyms) that are
#         not already in the title or blurb; language-neutral, space separated.
#         `hidden: true` keeps a drafted guide out of the hub and "Keep reading".

groups:
  procedures:
    near: [welders, traceability, software]
    name:
      en: "WPS & procedure qualification"
      pt: "WPS & qualificação de procedimentos"
      es: "WPS & cualificación de procedimientos"
    title:
      en: "WPS & Procedure Qualification"
      pt: "WPS & Qualificação de Procedimentos"
      es: "WPS & Cualificación de Procedimientos"
    intro:
      en: "Which record proves what, and how far a qualified procedure stretches before it needs a new test. Start here if an auditor has asked which WPQR supports a WPS."
      pt: "Que registo prova o quê, e até onde se estende um procedimento qualificado antes de precisar de um novo ensaio. Comece aqui se um auditor lhe perguntou que WPQR suporta uma WPS."
      es: "Qué registro prueba qué, y hasta dónde llega un procedimiento cualificado antes de necesitar un nuevo ensayo. Empiece aquí si un auditor le ha preguntado qué WPQR respalda una WPS."
  welders:
    near: [procedures, traceability, software]
    name:
      en: "welder qualification"
      pt: "qualificação de soldadores"
      es: "cualificación de soldadores"
    title:
      en: "Welder Qualification"
      pt: "Qualificação de Soldadores"
      es: "Cualificación de Soldadores"
    intro:
      en: "A certificate on file is not the same as a qualified welder. For when you need to know what keeps a qualification alive and what quietly ends it."
      pt: "Um certificado arquivado não é o mesmo que um soldador qualificado. Para quando precisa de saber o que mantém uma qualificação válida e o que a faz caducar sem aviso."
      es: "Un certificado archivado no es lo mismo que un soldador cualificado. Para cuando necesita saber qué mantiene viva una cualificación y qué la hace caducar sin avisar."
  traceability:
    near: [procedures, software, welders]
    name:
      en: "traceability"
      pt: "rastreabilidade"
      es: "trazabilidad"
    title:
      en: "Traceability"
      pt: "Rastreabilidade"
      es: "Trazabilidad"
    intro:
      en: "Linking a finished weld back to the steel it was made from, for ISO 3834 and EN 1090. For when the certificates are filed but nobody can say which plate went into which joint."
      pt: "Ligar uma soldadura acabada ao aço de que foi feita, para a ISO 3834 e a EN 1090. Para quando os certificados estão arquivados mas ninguém sabe dizer que chapa foi para que junta."
      es: "Vincular una soldadura terminada con el acero del que se hizo, para la ISO 3834 y la EN 1090. Para cuando los certificados están archivados pero nadie sabe decir qué chapa fue a qué unión."
  software:
    near: [traceability, procedures, welders]
    name:
      en: "choosing & deploying software"
      pt: "escolher & implementar software"
      es: "elegir & implantar software"
    title:
      en: "Choosing & Deploying Software"
      pt: "Escolher & Implementar Software"
      es: "Elegir & Implantar Software"
    intro:
      en: "Before you buy: the questions a feature checklist hides, and where the system should run. Read them in this order if you are starting from a spreadsheet."
      pt: "Antes de comprar: as perguntas que uma lista de funcionalidades esconde, e onde o sistema deve correr. Leia-os por esta ordem se está a partir de uma folha de cálculo."
      es: "Antes de comprar: las preguntas que una lista de funciones oculta, y dónde debe funcionar el sistema. Léalas en este orden si parte de una hoja de cálculo."

